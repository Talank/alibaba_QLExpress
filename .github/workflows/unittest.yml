name: Java Unit Test with Maven

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run tests with Maven (non-Windows)
        if: runner.os != 'Windows'
        run: mvn -B clean test --file pom.xml
      - name: Run tests with Maven (Windows)
        if: runner.os == 'Windows'
        run: mvn -B clean test --file pom.xml -Dexclude.perf.tests=true -Dsurefire.excludes=com/alibaba/qlexpress4/aparser/SyntaxTreeFactoryPerfTest.java
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false
